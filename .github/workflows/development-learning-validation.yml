name: Development Learning Validation

on:
  push:
    branches: [ci/development-learning-validation]
  pull_request:
    branches: [agent/development-learning]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-learning-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: >-
      ${{
        vars.SHARIPOVAI_SELF_HOSTED_CI == '1' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [self-hosted, linux, x64, sharipovai-ci]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: sqlite:////tmp/sharipovai-development-learning-${{ github.run_id }}.db
      SHARIPOVAI_DISABLE_AUTH: '1'
      EXCHANGE_LIVE_TRADING_ENABLED: '0'
      AUTONOMOUS_TESTNET_ENABLED: '0'
      TESTNET_EXECUTION_ENABLED: '0'
      EXECUTION_KILL_SWITCH: '1'
      EXCHANGE_MODE: sandbox
    steps:
      - name: Checkout combined ledger and learning service
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -r requirements-dev.txt --quiet
          python -m pip check

      - name: Compile development learning integration
        run: |
          python -m py_compile \
            learning_engine/development_learning.py \
            learning_engine/__init__.py \
            learning_engine/self_learning_supervisor.py \
            storage/project_database.py \
            tests/test_development_learning.py

      - name: Run development learning contracts
        run: python -m pytest tests/test_development_learning.py -q --tb=short

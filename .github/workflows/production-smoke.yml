name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: sharipovai-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHARIPOVAI_PRODUCTION_BASE_URL: ${{ vars.SHARIPOVAI_PRODUCTION_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Check deployed SharipovAI
        run: |
          : "${SHARIPOVAI_PRODUCTION_BASE_URL:?SHARIPOVAI_PRODUCTION_BASE_URL repository variable is required}"
          python scripts/production_smoke.py \
            --base-url "$SHARIPOVAI_PRODUCTION_BASE_URL" \
            --attempts 5 \
            --timeout 20 \
            --sleep 8 \
            --public-liveness-only \
            --json

name: SharipoAI Web 2

on:
  pull_request:
    branches: [main]
    paths:
      - 'web2/**'
      - '.github/workflows/web2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        vars.SHARIPOVAI_SELF_HOSTED_CI == '1' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [self-hosted, linux, x64, sharipovai-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://sharipovai-bot.onrender.com

      - name: Runtime smoke test
        shell: bash
        env:
          NEXT_PUBLIC_API_BASE_URL: https://sharipovai-bot.onrender.com
        run: |
          set -euo pipefail
          PORT="$(python - <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              print(listener.getsockname()[1])
          PY
          )"
          export PORT
          npm run start > /tmp/sharipoai-web2.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${PORT}/" > /tmp/sharipoai-home.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/sharipoai-web2.log >&2 || true
            exit 1
          fi
          grep -q 'SharipoAI' /tmp/sharipoai-home.html
          curl --fail --silent "http://127.0.0.1:${PORT}/sharipoai-logo.svg" > /tmp/sharipoai-logo.svg
          grep -q '<svg' /tmp/sharipoai-logo.svg
          test -s /tmp/sharipoai-home.html
          echo 'SharipoAI Web 2 runtime smoke test passed'

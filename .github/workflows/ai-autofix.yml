name: AI Autofix

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch/ref to fix"
        required: true
        default: "main"
      task:
        description: "Evidence label for the test run; no patch is applied"
        required: true
        default: "Run full pytest and record evidence without applying a patch."

permissions:
  contents: read

concurrency:
  group: ai-autofix-${{ github.event.issue.number || inputs.target_ref || github.ref }}
  cancel-in-progress: false

jobs:
  ai-autofix:
    if: vars.SHARIPOVAI_SELF_HOSTED_CI == '1'
    runs-on: [self-hosted, linux, x64, sharipovai-ci]
    timeout-minutes: 60

    steps:
      - name: Checkout evidence target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt --quiet
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt --quiet
            python -m pip install pytest httpx fastapi uvicorn --quiet
          fi
          python -m pip check

      - name: Run evidence-only pytest
        env:
          AI_AUTOFIX_TASK: ${{ inputs.task }}
          ADMIN_USERNAME: Samandar2212
          ADMIN_PASSWORD: ci-test-password
          AUTH_SECRET: ci-test-secret
          SHARIPOVAI_DISABLE_AUTH: "1"
          SHARIPOVAI_DATA_DIR: ${{ github.workspace }}/.ci-data
          DATABASE_URL: sqlite:////tmp/sharipovai-autofix-${{ github.run_id }}.db
          EXECUTION_KILL_SWITCH: "1"
          TESTNET_EXECUTION_ENABLED: "0"
          EXCHANGE_LIVE_TRADING_ENABLED: "0"
        run: python scripts/ai_autofix.py

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-autofix-log-${{ github.run_id }}
          path: pytest-autofix.log
          if-no-files-found: ignore
          retention-days: 7

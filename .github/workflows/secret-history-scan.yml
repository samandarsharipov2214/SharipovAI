name: Secret History Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is not shallow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Scan Git history with pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:507de9682470025fb3e7f57fe4c4ca8263d81369e027b6538b8a252a9c0371d4
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 .
